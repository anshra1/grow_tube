name: levelup_tube
description: "A high-performance, distraction-free learning application."
publish_to: 'none'
version: 2.4.3+22

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  bloc: ^9.2.1
  cached_network_image: ^3.4.1
  cloud_firestore: ^5.6.12
  cupertino_icons: ^1.0.8
  equatable: ^2.1.0
  file_picker: ^11.0.3
  firebase_analytics: ^11.6.0
  firebase_core: ^3.15.2
  firebase_crashlytics: ^4.3.2
  firebase_performance: ^0.10.1+10
  firebase_remote_config: ^5.5.0
  firebase_storage: ^12.4.10
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.0.10+1
  freezed_annotation: ^3.1.0
  gap: ^3.0.1
  get_it: ^7.7.0
  go_router: ^17.1.0
  google_fonts: ^8.0.1
  http: ^1.2.0
  image_cropper: ^12.2.1
  image_picker: ^1.2.2
  in_app_review: ^2.0.12
  internet_connection_checker_plus: ^2.9.1+2
  intl: ^0.19.0
  json_annotation: ^4.9.0
  objectbox: ^5.2.0
  objectbox_flutter_libs: ^5.2.0
  package_info_plus: ^8.0.0
  path_provider: ^2.1.2
  receive_sharing_intent: 1.8.0
  share_plus: ^12.0.2
  shared_preferences: ^2.2.3
  shimmer: ^3.0.0
  talker: ^5.1.13
  talker_bloc_logger: ^5.1.13
  talker_flutter: ^5.1.13
  toastification: ^3.0.3
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  youtube_player_iframe: ^5.2.2

dev_dependencies:
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.7
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  objectbox_generator: ^5.2.0
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - shorebird.yaml
    - google_fonts/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default:21
  adaptive_icon_background: "#f6f7f8"
  adaptive_icon_foreground: "assets/icons/icon.png"

flutter_native_splash:
  color: "#f6f7f8"
  # image: "assets/icons/icon.png"
  android_12:
    # image: "assets/icons/icon.png"
    color: "#f6f7f8"
